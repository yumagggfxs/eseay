<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paiement du cours - Airtel Money</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card-paiement {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }
        .header {
            text-align: center;
            margin-bottom: 25px;
        }
        .logo-airtel {
            color: #e20613;
            font-weight: 800;
            font-size: 26px;
            letter-spacing: -0.5px;
        }
        .subtitle {
            color: #64748b;
            font-size: 0.9rem;
            margin-top: 5px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            color: #1e293b;
            font-weight: 600;
            font-size: 0.9rem;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus, select:focus {
            border-color: #e20613;
        }
        .btn-payer {
            width: 100%;
            background-color: #e20613;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }
        .btn-payer:hover {
            background-color: #c10410;
        }
        .btn-payer:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }
        #message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            display: none;
            font-size: 0.9rem;
            line-height: 1.4;
            text-align: center;
        }
        .success {
            background-color: #dcfce7;
            color: #166534;
            border: 1px solid #bbf7d0;
        }
        .error {
            background-color: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }
    </style>
</head>
<body>

<div class="card-paiement">
    <div class="header">
        <div class="logo-airtel">Airtel Money</div>
        <p class="subtitle">Achetez votre accès Premium directement</p>
    </div>
    
    <form id="formPaiement">
        <div class="form-group">
            <label for="cours">Sélectionner le cours</label>
            <select id="cours" required>
                <option value="Développement Web Fullstack|25000">Développement Web Fullstack - 25 000 CDF</option>
                <option value="Python & Data Science|35000">Python & Data Science - 35 000 CDF</option>
            </select>
        </div>

        <div class="form-group">
            <label for="telephone">Numéro Airtel Money</label>
            <input type="tel" id="telephone" placeholder="Ex: +243970000000 ou 0970000000" required>
        </div>

        <button type="submit" id="btnPayer" class="btn-payer">Valider le paiement</button>
    </form>

    <div id="message"></div>
</div>

<script>
   // 🔗 URL de votre API Backend sur Render
const API_RENDER_URL = "https://back-end-h602.onrender.com";

document.addEventListener("DOMContentLoaded", function () {
    // Pré-remplir le téléphone si l'utilisateur est stocké localement
    const userConnecte = JSON.parse(localStorage.getItem("bmj_current_user"));
    if (userConnecte && userConnecte.telephone) {
        const inputTel = document.getElementById("telephone");
        if (inputTel) inputTel.value = userConnecte.telephone;
    }

    const formPaiement = document.getElementById("formPaiement");
    const btnPayer = document.getElementById("btnPayer");
    const messageDiv = document.getElementById("message");

    if (!formPaiement) return;

    formPaiement.addEventListener("submit", async function (e) {
        e.preventDefault();

        // Récupérer l'ID de l'apprenant connecté (ou 1 par défaut pour les tests)
        const apprenantId = userConnecte ? userConnecte.id : 1;
        
        const selectCours = document.getElementById("cours").value;
        const [coursNom, montantStr] = selectCours.split("|");
        const montant = parseFloat(montantStr) || 0; // Conversion en chiffre
        const telephone = document.getElementById("telephone").value.trim();

        btnPayer.disabled = true;
        btnPayer.innerText = "Envoi de la requête...";
        messageDiv.style.display = "none";

        try {
            const response = await fetch(`${API_RENDER_URL}/api/payer-cours`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    apprenant_id: parseInt(apprenantId),
                    cours_nom: coursNom,
                    montant: montant,
                    telephone: telephone
                })
            });

            const data = await response.json();

            messageDiv.style.display = "block";
            if (response.ok && data.success) {
                messageDiv.className = "success";
                messageDiv.innerHTML = "📲 <strong>Demande envoyée !</strong><br>Veuillez regarder l'écran de votre téléphone et saisir votre <strong>code PIN Airtel Money</strong> pour valider la transaction.";
            } else {
                messageDiv.className = "error";
                messageDiv.innerText = data.error || "Une erreur est survenue lors du paiement.";
            }
        } catch (err) {
            console.error("Erreur réseau :", err);
            messageDiv.style.display = "block";
            messageDiv.className = "error";
            messageDiv.innerText = "Impossible de contacter le serveur distant. Vérifiez votre connexion.";
        } finally {
            btnPayer.disabled = false;
            btnPayer.innerText = "Valider le paiement";
        }
    });
});
</script>

</body>
</html>
